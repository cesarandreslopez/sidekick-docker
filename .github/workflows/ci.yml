name: CI

on:
  push:
    branches: [main]
    paths:
      - 'sidekick-docker-shared/**'
      - 'sidekick-docker-cli/**'
      - 'sidekick-docker-vscode/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sidekick-docker-shared/**'
      - 'sidekick-docker-cli/**'
      - 'sidekick-docker-vscode/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'

jobs:
  quality:
    name: Lint, Types & Import DAG
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sidekick-docker-shared/package-lock.json
            sidekick-docker-cli/package-lock.json
            sidekick-docker-vscode/package-lock.json

      - name: Install dependencies (root + packages)
        run: |
          npm ci
          (cd sidekick-docker-shared && npm ci && npm run build)
          (cd sidekick-docker-cli && npm ci)
          (cd sidekick-docker-vscode && npm ci)

      - name: Lint
        run: npm run lint

      - name: Import DAG
        run: node scripts/check-imports.mjs

      # esbuild strips types without checking them: this is the only type
      # gate for the CLI and the extension.
      - name: Type-check
        run: |
          (cd sidekick-docker-shared && npx tsc --noEmit)
          (cd sidekick-docker-cli && npx tsc --noEmit)
          (cd sidekick-docker-vscode && npx tsc --noEmit)

  shared-tests:
    name: Shared Library Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sidekick-docker-shared

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sidekick-docker-shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cli-tests:
    name: CLI Tests & Build
    runs-on: ubuntu-latest
    needs: shared-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sidekick-docker-cli/package-lock.json

      - name: Build shared library
        working-directory: sidekick-docker-shared
        run: npm ci && npm run build

      - name: Install CLI dependencies
        working-directory: sidekick-docker-cli
        run: npm ci

      - name: Run CLI tests
        working-directory: sidekick-docker-cli
        run: npm test

      - name: Build CLI
        working-directory: sidekick-docker-cli
        run: npm run build

      - name: Verify binary
        working-directory: sidekick-docker-cli
        run: node dist/sidekick-docker.mjs --version

  build-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    needs: shared-tests

    defaults:
      run:
        working-directory: sidekick-docker-vscode

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sidekick-docker-vscode/package-lock.json

      - name: Build shared library
        working-directory: sidekick-docker-shared
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Test extension and webview
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build CLI for packaged SSH checks
        working-directory: sidekick-docker-cli
        run: npm ci && npm run build

      - name: Verify SSH in packaged CLI and VSIX
        working-directory: .
        run: node scripts/test-packages.mjs

      - name: Create dist directory
        run: mkdir -p dist

      - name: Package extension
        run: npx @vscode/vsce package --out dist/

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: sidekick-docker-vscode/dist/*.vsix
          retention-days: 7
