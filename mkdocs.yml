site_name: Sidekick Docker
site_description: Docker management TUI/CLI and VS Code extension — real-time dashboard for containers, Compose, images, volumes, and networks
site_url: https://cesarandreslopez.github.io/sidekick-docker/
repo_url: https://github.com/cesarandreslopez/sidekick-docker
repo_name: cesarandreslopez/sidekick-docker

theme:
  name: material
  logo: images/icon-128.png
  favicon: images/icon-64.png
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - overrides/assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - overrides/assets/javascripts/mermaid-modal.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - TUI Dashboard:
    - Overview: features/dashboard.md
    - Containers: features/containers.md
    - Compose Services: features/compose.md
    - Images: features/images.md
    - Volumes: features/volumes.md
    - Networks: features/networks.md
    - Keybindings: features/keybindings.md
  - VS Code Extension: features/vscode.md
  - CLI Commands: features/cli-commands.md
  - Configuration:
    - Docker Socket: configuration/docker-socket.md
  - Architecture:
    - Overview: architecture/overview.md
    - Panel System: architecture/panel-system.md
    - Streaming: architecture/streaming.md
  - API Reference:
    - DockerClient: api/docker-client.md
    - ComposeDetector: api/compose-detector.md
    - EventWatcher: api/event-watcher.md
    - StatsCollector: api/stats-collector.md
  - Contributing: contributing.md
  - Changelog: changelog.md
