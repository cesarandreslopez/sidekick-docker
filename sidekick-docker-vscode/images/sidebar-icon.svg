  <!-- Antenna -->
  <line x1="12" y1="1" x2="12" y2="4" stroke="#C5C5C5" stroke-width="1.5"/>
  <circle cx="12" cy="1" r="1" fill="#C5C5C5"/>
  <!-- Eyes -->
  <circle cx="8.5" cy="10" r="1.5" fill="#C5C5C5"/>
  <circle cx="15.5" cy="10" r="1.5" fill="#C5C5C5"/>
  <!-- Bold "D" in the lower center -->
  <text x="12" y="18.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="8" fill="#C5C5C5">D</text>
